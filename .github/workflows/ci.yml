name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Apple Silicon: the engines run on the Neural Engine, and the package
    # targets macOS 26.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build -c release

      # The suite is offline and needs no microphone by design, so it runs
      # unchanged on a headless runner. Tests that need the model on disk
      # skip themselves rather than fail.
      - name: Test
        run: swift test

      - name: Bundle
        run: ./scripts/bundle.sh
        env:
          # Do not try to create a signing certificate on CI — it needs a
          # keychain password. Ad-hoc signing is enough to prove the bundle
          # builds and opens.
          YAZ_NO_CERT: "1"

      - name: Verify the app launches
        run: |
          ./dist/yaz.app/Contents/MacOS/yaz --help > /dev/null
          ./dist/yaz.app/Contents/MacOS/yaz models list

  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts parse
        run: for f in scripts/*.sh; do sh -n "$f"; done
      - name: No Turkish in user-facing strings
        # The UI and CLI are English. Turkish survives only as linguistic data
        # (the lexicon, phonetic tables, hesitation sounds, the model prompt),
        # so this guards the files that are not data.
        #
        # Daemon.swift and both Info.plists are listed because leaving them out
        # is exactly how the Accessibility alert and the microphone permission
        # prompt stayed Turkish after everything else had been translated —
        # the two first sentences a new user reads.
        #
        # grep -E, not -P: the runner is macOS, whose BSD grep has no -P. It
        # exits 2 on the unknown flag, `if grep ...` reads that as "no match",
        # and the guard passes without having looked at anything. A check that
        # cannot fail is worse than no check, so the sanity case below proves
        # the pattern still matches before the real check runs.
        run: |
          printf 'let x = "%s"\n' "çalışıyor" > /tmp/tr-probe.swift
          grep -lE '"[^"]*[çğıöşüÇĞİÖŞÜ][^"]*"' /tmp/tr-probe.swift >/dev/null \
            || { echo "the Turkish pattern matches nothing — this guard is broken"; exit 1; }
          rm -f /tmp/tr-probe.swift
          if grep -rlE '"[^"]*[çğıöşüÇĞİÖŞÜ][^"]*"' \
               Sources/yaz/Yaz.swift Sources/yaz/Doctor.swift \
               Sources/yaz/Daemon.swift Sources/yaz/UI/ 2>/dev/null; then
            echo "Turkish string found in a user-facing file"; exit 1
          fi
          if grep -lE '<string>[^<]*[çğıöşüÇĞİÖŞÜ]' \
               Sources/yaz/Info.plist Resources/AppInfo.plist 2>/dev/null; then
            echo "Turkish string found in a permission prompt"; exit 1
          fi

      - name: Test names are English
        # Suite and test names are the closest thing this repo has to prose
        # documentation of behaviour. Turkish string *data* inside a test body
        # is fine and expected; the names are not.
        run: |
          if grep -rhoE '@(Suite|Test)\("[^"]*[çğıöşüÇĞİÖŞÜ][^"]*"' Tests/; then
            echo "Turkish test name found"; exit 1
          fi
